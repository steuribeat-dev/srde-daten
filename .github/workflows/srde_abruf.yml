name: SRDE Datenabruf

on:
  schedule:
    - cron: "45 17 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  abruf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Daten abrufen
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          FUNDAMENTALS: ${{ vars.FUNDAMENTALS }}
        run: python srde_abruf.py
      - name: Daten speichern
        run: |
          git config user.name "srde-bot"
          git config user.email "srde-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Daten $(date -u +%Y-%m-%d)"
          git push
